    <h2>my time</h2>
    <p id="clock"></p>

    <p>Use ↑ ↓ to select. Press Enter to continue.</p>

    <script>
        function updateClock() {
            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                timeZone: "Europe/London"
            });

            document.getElementById("clock").innerText = time;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
